<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>统计 · 减脂记录</title>
<meta name="theme-color" content="#16a34a">
<link rel="icon" href="favicon.svg" type="image/svg+xml">
<link rel="manifest" href="manifest.webmanifest">
<link rel="stylesheet" href="assets/style.css">
</head>
<body>

<header class="topbar">
  <div class="wrap">
    <div class="brand"><span class="dot"></span><span>减脂记录</span></div>
    <span class="date-chip" id="rangeChip">—</span>
  </div>
</header>
<nav id="nav" class="nav" aria-label="主导航"></nav>

<main class="wrap" id="main">

  <section class="card">
    <div class="row-between">
      <h2>数据统计</h2>
      <div class="seg" id="rangeSeg">
        <button data-days="7" class="active">7 天</button>
        <button data-days="30">30 天</button>
        <button data-days="90">90 天</button>
        <button data-days="365">1 年</button>
      </div>
    </div>
    <div class="grid grid-4 mt12">
      <div class="stat brand">
        <div class="k">日均运动</div>
        <div class="v" id="kpiMin">0<small>分钟</small></div>
      </div>
      <div class="stat">
        <div class="k">运动天数</div>
        <div class="v" id="kpiDays">0<small>天</small></div>
      </div>
      <div class="stat">
        <div class="k">日均摄入</div>
        <div class="v" id="kpiKcal">0<small>kcal</small></div>
      </div>
      <div class="stat">
        <div class="k">体重变化</div>
        <div class="v" id="kpiWeight">—</div>
      </div>
    </div>
  </section>

  <section class="card">
    <div class="card-head">
      <span class="icon">⚖️</span>
      <h2 class="grow">体重趋势</h2>
      <span class="small muted" id="weightMeta"></span>
    </div>
    <div class="chart-box"><canvas id="weightChart" data-height="210"></canvas></div>
  </section>

  <section class="card">
    <div class="card-head">
      <span class="icon">🏃</span>
      <h2 class="grow">每日运动时长</h2>
      <span class="small muted" id="exMeta"></span>
    </div>
    <div class="chart-box"><canvas id="exChart" data-height="200"></canvas></div>
  </section>

  <section class="card">
    <div class="card-head">
      <span class="icon">🍚</span>
      <h2 class="grow">每日摄入热量</h2>
      <span class="small muted" id="kcalMeta"></span>
    </div>
    <div class="chart-box"><canvas id="kcalChart" data-height="200"></canvas></div>
  </section>

  <section class="card">
    <div class="card-head">
      <span class="icon">🥗</span>
      <h2 class="grow">三大营养素占比</h2>
    </div>
    <div class="grid grid-2">
      <div class="chart-box"><canvas id="macroChart" data-height="190"></canvas></div>
      <div class="stack">
        <div class="stat"><div class="k">蛋白质</div><div class="v" id="sumProtein">0<small>g</small></div></div>
        <div class="stat"><div class="k">碳水</div><div class="v" id="sumCarbs">0<small>g</small></div></div>
        <div class="stat"><div class="k">脂肪</div><div class="v" id="sumFat">0<small>g</small></div></div>
      </div>
    </div>
    <div class="legend" id="macroLegend"></div>
    <p class="small muted mt8">占比按供能计算：蛋白质与碳水 4 kcal/g，脂肪 9 kcal/g。</p>
  </section>

  <section class="card">
    <div class="card-head">
      <span class="icon">📅</span>
      <h2 class="grow">区间明细</h2>
      <a class="btn btn-sm btn-ghost" href="settings.html">导出 CSV</a>
    </div>
    <div class="table-scroll">
      <table class="data" id="detailTable">
        <thead><tr><th>日期</th><th>运动(分钟)</th><th>条数</th><th>摄入(kcal)</th><th>蛋白(g)</th><th>碳水(g)</th><th>脂肪(g)</th><th>体重(kg)</th></tr></thead>
        <tbody></tbody>
      </table>
    </div>
  </section>

  <p class="foot">统计只读取本机数据；导出的 CSV 可用于 Excel 做更细的分析。</p>
</main>

<script src="assets/storage.js"></script>
<script src="assets/app.js"></script>
<script src="assets/charts.js"></script>
<script>
(function () {
  var S = window.FatLossStorage, A = window.FatLossApp, P = window.Charts.PALETTE;
  A.applyTheme();
  A.renderNav('stats.html');

  var days = 7;

  document.getElementById('rangeSeg').addEventListener('click', function (e) {
    var b = e.target.closest('button');
    if (!b) return;
    days = Number(b.getAttribute('data-days'));
    Array.prototype.forEach.call(this.querySelectorAll('button'), function (x) { x.classList.remove('active'); });
    b.classList.add('active');
    render();
  });

  function signed(v) { return (v > 0 ? '+' : '') + A.fmtNum(v, 2); }

  function render() {
    var today = S.today();
    var dates = S.dateRange(today, days);
    var st = S.loadSettings();
    document.getElementById('rangeChip').textContent = dates[0] + ' → ' + today;

    var summaries = dates.map(function (d) { return S.daySummary(d); });
    var minutes = summaries.map(function (s) { return s.minutes; });
    var kcals = summaries.map(function (s) { return s.kcal; });
    var weightsRaw = S.weightSeries(dates); // 未知日沿用上一个体重，折线连续
    var weights = weightsRaw.map(function (v) { return v === null ? undefined : v; });

    var totalMin = minutes.reduce(function (a, b) { return a + b; }, 0);
    var activeDays = minutes.filter(function (m) { return m > 0; }).length;
    var kcalDays = kcals.filter(function (k) { return k > 0; });
    var avgKcal = kcalDays.length ? kcalDays.reduce(function (a, b) { return a + b; }, 0) / kcalDays.length : 0;

    document.getElementById('kpiMin').innerHTML = A.fmtNum(totalMin / days, 0) + '<small>分钟</small>';
    document.getElementById('kpiDays').innerHTML = activeDays + '<small>天</small>';
    document.getElementById('kpiKcal').innerHTML = A.fmtNum(avgKcal) + '<small>kcal</small>';

    var knownW = weightsRaw.filter(function (v) { return v !== null; });
    var wDelta = knownW.length >= 2 ? knownW[knownW.length - 1] - knownW[0] : null;
    document.getElementById('kpiWeight').innerHTML = wDelta === null ? '—' :
      '<span style="color:' + (wDelta <= 0 ? 'var(--brand)' : 'var(--warn)') + '">' + signed(wDelta) + '<small>kg</small></span>';

    document.getElementById('weightMeta').textContent = knownW.length
      ? '最新 ' + A.fmtNum(knownW[knownW.length - 1], 2) + ' kg · 区间内记录 ' +
        S.loadRecords().weights.filter(function (w) { return w.date >= dates[0] && w.date <= today; }).length + ' 次'
      : '还没有体重记录';

    window.Charts.line(document.getElementById('weightChart'), {
      labels: dates.map(A.shortDate),
      series: [{ name: '体重', data: weights, color: P.weight, fill: true }],
      unit: 'kg',
      fmt: function (v) { return A.fmtNum(v, 2); },
      emptyText: '还没有体重记录，去「记录」页填一次',
      height: 210
    });

    var perDayGoal = Math.round((st.weeklyGoalMin || 0) / 7);
    window.Charts.bars(document.getElementById('exChart'), {
      labels: dates.map(A.shortDate),
      data: minutes,
      color: P.brand,
      name: '运动',
      unit: '分钟',
      goal: perDayGoal || null,
      goalLabel: perDayGoal ? '日均目标 ' + perDayGoal + ' 分钟' : '',
      emptyText: '这段时间还没有运动记录',
      height: 200
    });
    document.getElementById('exMeta').textContent = '合计 ' + A.fmtNum(totalMin) + ' 分钟 · 有记录 ' + activeDays + ' 天';

    window.Charts.bars(document.getElementById('kcalChart'), {
      labels: dates.map(A.shortDate),
      data: kcals,
      color: P.kcal,
      name: '摄入',
      unit: 'kcal',
      goal: st.dailyKcal || null,
      goalLabel: st.dailyKcal ? '目标 ' + st.dailyKcal + ' kcal' : '',
      emptyText: '这段时间还没有饮食记录',
      height: 200
    });
    document.getElementById('kcalMeta').textContent = kcalDays.length
      ? '有记录 ' + kcalDays.length + ' 天 · 日均 ' + A.fmtNum(avgKcal) + ' kcal'
      : '暂无摄入数据';

    var sumProtein = summaries.reduce(function (a, s) { return a + s.protein; }, 0);
    var sumCarbs = summaries.reduce(function (a, s) { return a + s.carbs; }, 0);
    var sumFat = summaries.reduce(function (a, s) { return a + s.fat; }, 0);
    document.getElementById('sumProtein').innerHTML = A.fmtNum(sumProtein, 0) + '<small>g</small>';
    document.getElementById('sumCarbs').innerHTML = A.fmtNum(sumCarbs, 0) + '<small>g</small>';
    document.getElementById('sumFat').innerHTML = A.fmtNum(sumFat, 0) + '<small>g</small>';

    var macro = [
      { label: '蛋白质', value: Math.round(sumProtein * 4), color: P.protein },
      { label: '碳水', value: Math.round(sumCarbs * 4), color: P.carbs },
      { label: '脂肪', value: Math.round(sumFat * 9), color: P.fat }
    ];
    var macroTotal = macro.reduce(function (a, b) { return a + b.value; }, 0);
    window.Charts.donut(document.getElementById('macroChart'), {
      items: macro,
      centerValue: A.fmtNum(macroTotal),
      centerTitle: '区间总 kcal',
      emptyText: '暂无营养数据',
      height: 190
    });
    document.getElementById('macroLegend').innerHTML = macro.map(function (m) {
      var p = macroTotal ? Math.round((m.value / macroTotal) * 100) : 0;
      return '<span class="item"><span class="swatch" style="background:' + m.color + '"></span>' +
        m.label + ' ' + p + '%（' + A.fmtNum(m.value) + ' kcal）</span>';
    }).join('');

    // 明细表：倒序，只显示有数据的日期
    var tbody = document.querySelector('#detailTable tbody');
    var rows = summaries.slice().reverse().filter(function (s) {
      return s.minutes > 0 || s.kcal > 0 || s.weight !== null;
    });
    tbody.innerHTML = rows.length ? rows.map(function (s) {
      return '<tr><td>' + s.date + '</td><td>' + A.fmtNum(s.minutes) + '</td><td>' + s.exerciseCount +
        '</td><td>' + A.fmtNum(s.kcal) + '</td><td>' + A.fmtNum(s.protein, 1) + '</td><td>' +
        A.fmtNum(s.carbs, 1) + '</td><td>' + A.fmtNum(s.fat, 1) + '</td><td>' +
        (s.weight === null ? '—' : A.fmtNum(s.weight, 2)) + '</td></tr>';
    }).join('') : '<tr><td colspan="8" class="empty">这段时间还没有任何记录</td></tr>';
  }

  window.addEventListener('fatloss:change', render);
  window.matchMedia('(prefers-color-scheme: dark)').addEventListener('change', function () {
    window.Charts.redrawAll();
  });
  render();
})();
</script>
</body>
</html>
